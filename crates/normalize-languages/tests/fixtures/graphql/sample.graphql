"""A scalar representing a date and time value."""
scalar DateTime
scalar UUID

# Node interface for objects with a unique ID
interface Node {
  id: ID!
}

interface Timestamped {
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A registered user in the system."""
type User implements Node & Timestamped {
  id: ID!
  name: String!
  email: String!
  role: UserRole!
  posts: [Post!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Post implements Node & Timestamped {
  id: ID!
  title: String!
  body: String!
  author: User!
  tags: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum UserRole {
  ADMIN
  EDITOR
  VIEWER
}

union SearchResult = User | Post

input CreateUserInput {
  name: String!
  email: String!
  role: UserRole = VIEWER
}

input UpdatePostInput {
  title: String
  body: String
  tags: [String!]
}

type Query {
  user(id: ID!): User
  users(role: UserRole): [User!]!
  post(id: ID!): Post
  search(query: String!): [SearchResult!]!
}

type Mutation {
  createUser(input: CreateUserInput!): User!
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  deletePost(id: ID!): Boolean!
}

type Subscription {
  userUpdated(id: ID!): User!
}

# Custom directive definition: declares `@auth` as an attachable annotation,
# distinct from a directive *application* like `@deprecated` below.
directive @auth(role: UserRole = VIEWER) on FIELD_DEFINITION | OBJECT

extend type User {
  """Fields the requester is allowed to see, gated by role."""
  isAdmin: Boolean! @auth(role: ADMIN)
}

fragment UserSummary on User {
  id
  name
  role
}

# Idiomatic real-world client operations, co-located with the schema (as in
# a codegen-driven repo where .graphql operation documents ship alongside
# the SDL). Exercises variables, fragment spreads, inline fragments,
# directive applications with arguments, aliases, and nested selections.
query GetUser($id: ID!, $withPosts: Boolean = false) {
  user(id: $id) {
    ...UserSummary
    email
    posts @include(if: $withPosts) {
      id
      title
      author {
        name
      }
    }
  }
}

query SearchAll($term: String!) {
  search(query: $term) {
    ... on User {
      name
      email
    }
    ... on Post {
      title
      author {
        name
      }
    }
  }
}

mutation CreateNewUser($input: CreateUserInput!) {
  createUser(input: $input) {
    ...UserSummary
  }
}

subscription WatchUser($id: ID!) {
  userUpdated(id: $id) {
    id
    name
  }
}
