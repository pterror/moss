# Completeness matrix for nginx query files.
# One small, commented construct per node-type variant found in
# arborium-nginx-2.17.0's node-types.json (cross-referenced via
# `normalize syntax ast` / `normalize syntax query`), plus a NEGATIVE
# section of near-miss constructs that must NOT match.
#
# node-types.json summary relevant to these queries:
#   simple_directive.name      : (directive)  -- single type, no variants
#   block_directive.name       : (directive)  -- single type, no variants
#   lua_block_directive        : no name field; keyword is one of 7 anonymous
#                                 literal tokens (access_by_lua_block, ...)
#   simple_directive's `include` argument: unquoted args containing a `*`
#                                 glob split into multiple sibling `param`
#                                 nodes with no wrapping node (see
#                                 nginx.imports.scm comment).

# --- calls / tags: simple_directive.name -----------------------------------
worker_processes auto;

# --- calls / tags: block_directive.name -------------------------------------
events {
    worker_connections 1024;
}

# --- calls / tags / complexity: lua_block_directive, each of the 7 keyword
# variants the grammar defines as anonymous tokens.
http {
    server {
        location /a {
            access_by_lua_block { ngx.say("a") }
        }
        location /b {
            balancer_by_lua_block { ngx.say("b") }
        }
        location /c {
            body_filter_by_lua_block { ngx.say("c") }
        }
        location /d {
            content_by_lua_block { ngx.say("d") }
        }
        location /e {
            header_filter_by_lua_block { ngx.say("e") }
        }
        location /f {
            log_by_lua_block { ngx.say("f") }
        }
        location /g {
            rewrite_by_lua_block { ngx.say("g") }
        }
    }

    # --- imports: plain unquoted path (single `param`, no glob) -----------
    include /etc/nginx/mime.types;

    # --- imports: double-quoted path (single `param`, string node) --------
    include "quoted/path.conf";

    # --- imports: single-quoted path (single `param`, string node) --------
    include 'single/quoted.conf';

    # --- imports: relative path, no leading slash --------------------------
    include relative/conf.d/site.conf;

    # --- imports: glob path -- grammar splits into 3 sibling `param` nodes;
    # the anchored query captures only the first fragment (the literal
    # prefix), documented in nginx.imports.scm.
    include /etc/nginx/conf.d/*.conf;

    # --- imports: bare wildcard with directory prefix, no suffix ----------
    include sites-enabled/*;
}

# --- NEGATIVE: directive named "include" is not what makes something an
# import -- only the *simple_directive* form counts (the query has no
# block_directive alternative, and directives whose name merely contains
# "include" as a substring must not match the exact #eq? check).
events {
    includes_something_else 1;
}
